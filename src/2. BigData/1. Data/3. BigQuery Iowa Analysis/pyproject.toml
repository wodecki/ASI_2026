[project]
name = "bigquery-iowa-analysis"
version = "0.1.0"
description = "BigQuery Iowa liquor sales data analysis with Python"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "google-cloud-bigquery>=3.45",
    "pandas>=2.3,<3",
    "db-dtypes>=1.7",
    "pyarrow>=25",
]

[dependency-groups]
dev = [
    "ipython>=8.12.0",
    "jupyter>=1.0.0",
]
