[project]
name = "bigdata-pandas-vs-duckdb"
version = "0.1.0"
description = "Educational demo comparing pandas and DuckDB performance on large datasets (100M-1B records)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.3,<3",
    "duckdb>=1.5",
    "pyarrow>=25",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
